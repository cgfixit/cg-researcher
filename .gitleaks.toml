# Extends the default ruleset. Allowlists are public non-secrets only.
# Each entry is condition AND (path and regex), so a different secret in the
# same file is still reported.
[extend]
useDefault = true

[[allowlists]]
description = "Telegram Bot API documentation example token used in sanitizer tests"
condition = "AND"
regexTarget = "match"
regexes = ['''AAHdqTcvCH1vGWJxfSeofSAs0K5PALDsawQ''']
paths = ['''crates/cg-core/src/sanitizer\.rs''']

[[allowlists]]
description = "SHA-256 of a screenshot PNG recorded under docs/screenshots or docs/verification, not a credential"
condition = "AND"
regexTarget = "line"
regexes = ['''(?i)"[^"\\]+\.png"\s*:\s*"[0-9a-f]{64}"''']
paths = ['''docs/(screenshots|verification)/''']
