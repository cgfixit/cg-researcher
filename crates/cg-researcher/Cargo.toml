[package]
name = "cg-researcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
toml = "1.1.8"
url = "2.5.8"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
cg-audit = { version = "0.1.0", path = "../cg-audit" }
cg-connectors = { version = "0.1.0", path = "../cg-connectors" }
cg-core = { version = "0.1.0", path = "../cg-core" }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.3"

[lints]
workspace = true
