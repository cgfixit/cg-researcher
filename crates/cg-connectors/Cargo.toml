[package]
name = "cg-connectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
getrandom = "0.4.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "form"] }
scraper = { version = "0.29.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "net", "io-util"] }
tracing = "0.1.44"
url = "2.5.8"
toml = "1.1.8"
subtle = "2.6.1"
cg-core = { version = "0.1.0", path = "../cg-core" }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

[lints]
workspace = true
