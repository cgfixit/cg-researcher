[package]
name = "cg-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
getrandom.workspace = true
hex.workspace = true
hmac.workspace = true
quick-xml.workspace = true
regex.workspace = true
reqwest = { workspace = true, features = ["rustls", "json", "query"] }
rusqlite = { workspace = true, features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "fs"] }
toml.workspace = true
tracing.workspace = true
url.workspace = true
# Mozilla roots for the external-model client; already in the lock via rustls-platform-verifier.
webpki-root-certs.workspace = true
cg-audit.workspace = true
cg-graph.workspace = true
zip = { workspace = true, features = ["deflate"] }
chrono = { workspace = true, features = ["clock"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the lock via rustls-platform-verifier; native SecItem* API, no argv secrets.
security-framework.workspace = true

[dev-dependencies]
tempfile.workspace = true
# egress TLS tests read the ClientHello from a loopback TcpListener.
tokio = { workspace = true, features = ["net"] }

[lints]
workspace = true
