version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: cg/main
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: cg/main
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
