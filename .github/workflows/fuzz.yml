name: fuzz
# Coverage-guided fuzzing (cargo-fuzz / libFuzzer) of the parsers that take
# untrusted input: chat attachments (PNG / DOCX / Markdown / text), the
# input/output guards (injection scan, untrusted wrapper, link defang,
# redaction), and streamed answers (SSE parser + per-chunk output guard).
# Targets assert security properties, not just "no panic"; see
# fuzz/fuzz_targets/*.rs (and fuzz/<target>.dict where present). PRs touching
# those files: 2 min per target. Weekly: 15 min per target. Crash inputs are uploaded as artifacts.
on:
  pull_request:
    paths:
      - "crates/cg-core/src/attachments.rs"
      - "crates/cg-core/src/config.rs" # AttachmentConfig limits drive the attachments target
      - "crates/cg-core/src/sanitizer.rs"
      - "crates/cg-core/src/secrets.rs"
      - "crates/cg-core/src/stream.rs"
      - "crates/cg-core/src/llm.rs"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "47 4 * * 2" # Tue 04:47 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # rust-toolchain.toml pins stable for the workspace; rustup would pick it
      # over the nightly installed below, and cargo-fuzz's -Z flags need nightly.
      RUSTUP_TOOLCHAIN: nightly-2026-10-15
    strategy:
      fail-fast: false
      matrix:
        target: [attachments, sanitizer, stream]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-fuzz needs nightly (sanitizer flags). Pinned date; bump deliberately.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: nightly-2026-10-15
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: lockfile is current
        run: cargo fetch --locked --manifest-path fuzz/Cargo.toml
      - name: fuzz ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          SECS: ${{ github.event_name == 'schedule' && '900' || '120' }}
        run: |
          dict=()
          if [ -f "fuzz/$TARGET.dict" ]; then dict=("-dict=fuzz/$TARGET.dict"); fi
          cargo fuzz run -O "$TARGET" -- "${dict[@]}" -max_total_time="$SECS" -max_len=65536 -rss_limit_mb=2048 -timeout=10
      - name: crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          retention-days: 14
          if-no-files-found: ignore
