name: release
# Three ways in:
#   * v* tag: build, then `publish` creates a public release immediately
#     (not a draft). Reviewed path; it may become GitHub Latest.
#   * workflow_dispatch (no inputs, no version): build and publish an unreviewed
#     prerelease tagged `nightly-YYYYMMDD-<sha7>` at this SHA. Not Latest.
#     Re-running a SHA whose auto release already has the app zip, its sha256,
#     the universal CLI tarball and its sha256 skips the rebuild and succeeds.
#     A draft or a missing asset is rebuilt and filled in without `--clobber`
#     (clobber deletes the old asset before the new upload finishes).
#   * daily schedule (09:07 America/New_York, see `gate`): same prerelease when
#     main's tip has no `v*` tag and no complete GitHub Release for that commit.
#     A previous green run is not a publication: artifact-only successes from
#     the old manual path leave the nightly free to cut.
#     Off by default: the schedule only runs `gate` when repo variable
#     NIGHTLY_RELEASE=true (nightly only) or SCHEDULED_JOBS=true (every cron
#     in .github/workflows) is set; otherwise nothing builds or publishes on
#     the schedule. Tags and dispatch are unaffected.
# Artifacts:
#   * app-arm64: Apple Silicon cg-researcher.app (aarch64-apple-darwin), zipped
#     with ditto + SHA-256; build provenance attested when the repo is public
#     (GitHub artifact attestations need Enterprise Cloud for private repos).
#   * universal: arm64+x86_64 CLI tarball for install-from-binary users.
# Ad-hoc signing is NOT Developer ID / notarization. Downloaded copies get
# quarantined by Gatekeeper; install.sh from source remains the supported path.
on:
  push:
    tags: ["v*"]
  schedule:
    # Actions cron is UTC only. Both fire; `gate` keeps the one where it is 09:xx
    # in America/New_York (13:07 UTC under EDT, 14:07 UTC under EST). Off the hour
    # because GitHub delays runs queued at :00.
    - cron: "7 13 * * *"
    - cron: "7 14 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gate:
    name: decide what this run publishes
    if: github.event_name != 'schedule' || (vars.SCHEDULED_JOBS == 'true' || vars.NIGHTLY_RELEASE == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go: ${{ steps.decide.outputs.go }}
      kind: ${{ steps.decide.outputs.kind }}
      tag: ${{ steps.decide.outputs.tag }}
      public: ${{ steps.decide.outputs.public }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          public=false
          [[ "$(gh api "repos/$REPO" --jq .private)" == false ]] && public=true
          go=false
          kind=none
          tag=""
          auto_tag=""
          auto_complete=false
          vtag=""
          complete_release=""

          # Names only. The schedule can stop on a v* tag before any release API call.
          collect_names() {
            vtag=""
            auto_tag=""
            local t
            while IFS= read -r t; do
              [[ -z "$t" ]] && continue
              if [[ -z "$vtag" && "$t" == v* ]]; then
                vtag="$t"
              fi
              # Sorted input, so the first match is the earliest nightly tag.
              if [[ -z "$auto_tag" && "$t" =~ ^nightly-[0-9]{8}-[0-9a-f]{7}$ ]]; then
                auto_tag="$t"
              fi
            done < <(git tag --points-at "$SHA" | sort)
          }

          # Published (not a draft) and already holding the four assets the
          # publish job uploads. Keep the names in sync with that job's `files`.
          release_is_complete() {
            local tag="$1"
            local draft assets f
            draft="$(gh release view "$tag" --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null)" || return 1
            [[ "$draft" == "false" ]] || return 1
            assets="$(gh release view "$tag" --repo "$REPO" --json assets --jq '.assets[].name' 2>/dev/null)" || return 1
            for f in \
              cg-researcher-macos-arm64.app.zip \
              cg-researcher-macos-arm64.app.zip.sha256 \
              cg-researcher-macos-universal.tar.gz \
              cg-researcher-macos-universal.tar.gz.sha256
            do
              printf '%s\n' "$assets" | grep -Fxq -- "$f" || return 1
            done
            return 0
          }

          # Prefer the earliest complete nightly tag. If none is complete, keep
          # the earliest nightly tag so a partial release is repaired in place.
          resolve_releases() {
            local t fallback="$auto_tag"
            auto_tag=""
            auto_complete=false
            complete_release=""
            while IFS= read -r t; do
              [[ -z "$t" ]] && continue
              if release_is_complete "$t"; then
                if [[ -z "$complete_release" ]]; then
                  complete_release="$t"
                fi
                if [[ "$auto_complete" == false && "$t" =~ ^nightly-[0-9]{8}-[0-9a-f]{7}$ ]]; then
                  auto_tag="$t"
                  auto_complete=true
                fi
              fi
            done < <(git tag --points-at "$SHA" | sort)
            if [[ "$auto_complete" == false ]]; then
              auto_tag="$fallback"
            fi
          }

          mint_auto_tag() {
            local resolved
            if [[ -n "$auto_tag" ]]; then
              return 0
            fi
            auto_tag="nightly-$(date -u +%Y%m%d)-${SHA:0:7}"
            resolved="$(git rev-parse -q --verify "refs/tags/${auto_tag}^{commit}" 2>/dev/null || true)"
            if [[ -n "$resolved" && "$resolved" != "$SHA" ]]; then
              printf 'tag %s already points at %s, not %s; refusing to retarget\n' \
                "$auto_tag" "${resolved:0:7}" "${SHA:0:7}" >&2
              exit 1
            fi
          }

          case "$EVENT" in
            push)
              go=true
              kind=tag
              tag="$REF_NAME"
              ;;
            workflow_dispatch)
              git cat-file -e "${SHA}^{commit}"
              collect_names
              resolve_releases
              if [[ "$auto_complete" == true ]]; then
                echo "auto release $auto_tag already has the app and universal CLI assets; skipping rebuild"
                tag="$auto_tag"
              else
                mint_auto_tag
                go=true
                kind=dispatch
                tag="$auto_tag"
                echo "manual dispatch publishes prerelease $tag (not Latest)"
              fi
              ;;
            schedule)
              hour="$(TZ=America/New_York date +%H)"
              if [[ "$hour" != "09" ]]; then
                echo "schedule: $hour:xx in America/New_York, not the 09:xx run; skipping"
              else
                git cat-file -e "${SHA}^{commit}"
                collect_names
                if [[ -n "$vtag" ]]; then
                  echo "main@${SHA:0:7} already tagged $vtag; nothing to cut"
                else
                  # A green release.yml run is not a publication. Artifact-only
                  # manual successes used to block this branch (issue #43).
                  resolve_releases
                  if [[ -n "$complete_release" ]]; then
                    echo "main@${SHA:0:7} already published ($complete_release); nothing to cut"
                  else
                    mint_auto_tag
                    go=true
                    kind=nightly
                    tag="$auto_tag"
                    echo "schedule publishes prerelease $tag (not Latest)"
                  fi
                fi
              fi
              ;;
          esac
          echo "event=$EVENT go=$go kind=$kind tag=$tag public=$public"
          {
            echo "go=$go"
            echo "kind=$kind"
            echo "tag=$tag"
            echo "public=$public"
          } >> "$GITHUB_OUTPUT"

  app-arm64:
    needs: [gate]
    if: needs.gate.outputs.go == 'true'
    runs-on: macos-15 # arm64 runner
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin
      - name: build (aarch64-apple-darwin)
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == arm64 ]] || { echo "expected an arm64 runner"; exit 1; }
          cargo build --release --locked -p cg-researcher --target aarch64-apple-darwin
      - name: bundle + ad-hoc sign + zip
        run: scripts/bundle-app.sh
      - name: smoke the bundle
        run: |
          set -euo pipefail
          app=dist/cg-researcher.app
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E 'Identifier=com.cgfixit.cg-researcher|flags=.*runtime'
          "$app/Contents/MacOS/cg-researcher" --version
          h="$RUNNER_TEMP/h"; "$app/Contents/MacOS/cg-researcher" --home "$h" init
          test "$(stat -f %Lp "$h")" = 700
          rm -rf "$app"; ditto -x -k dist/cg-researcher-macos-arm64.app.zip dist/
          codesign --verify --strict --deep "$app"
      - name: attest build provenance (public repos only)
        if: needs.gate.outputs.public == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/cg-researcher-macos-arm64.app.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cg-researcher-macos-arm64-app
          path: dist/cg-researcher-macos-arm64.app.zip*
          if-no-files-found: error

  universal:
    needs: [gate]
    if: needs.gate.outputs.go == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      # Intel is going away: macOS 27 (Golden Gate) is Apple silicon only and the last release
      # with Rosetta 2. Drop this job, `universal` in publish's needs, and the tarball in the
      # `gh release create` list once Intel stops mattering. This step nags from the date below.
      - name: Intel artifact sunset check
        env:
          INTEL_SUNSET: "2027-08-27"
        run: |
          if [[ ! "$(date -u +%F)" < "$INTEL_SUNSET" ]]; then
            echo "::warning title=Intel artifact sunset::universal (x86_64) tarball is past its $INTEL_SUNSET sunset date; remove this job."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: build both slices
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          set -euo pipefail
          cargo build --release --locked -p cg-researcher --target aarch64-apple-darwin
          cargo build --release --locked -p cg-researcher --target x86_64-apple-darwin
      - name: lipo, sign, package
        run: |
          set -euo pipefail
          mkdir -p dist/cg-researcher
          lipo -create -output dist/cg-researcher/cg-researcher \
            target/aarch64-apple-darwin/release/cg-researcher \
            target/x86_64-apple-darwin/release/cg-researcher
          for arch in arm64 x86_64; do
            lipo dist/cg-researcher/cg-researcher -verify_arch "$arch"
          done
          codesign --force --sign - --options runtime --identifier com.cgfixit.cg-researcher dist/cg-researcher/cg-researcher
          codesign --verify --strict dist/cg-researcher/cg-researcher
          cp -R LICENSE README.md SECURITY.md INVARIANTS.md config dist/cg-researcher/
          cp packaging/macos/CLI-INSTALL.md dist/cg-researcher/INSTALL.md
          tar -C dist -czf "dist/cg-researcher-macos-universal.tar.gz" cg-researcher
          ( cd dist && shasum -a 256 cg-researcher-macos-universal.tar.gz > cg-researcher-macos-universal.tar.gz.sha256 )
          cat dist/*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cg-researcher-macos-universal
          path: dist/cg-researcher-macos-universal.tar.gz*
          if-no-files-found: error

  publish:
    needs: [gate, app-arm64, universal]
    if: success() && (needs.gate.outputs.kind == 'tag' || needs.gate.outputs.kind == 'nightly' || needs.gate.outputs.kind == 'dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cg-researcher-macos-*
          merge-multiple: true
      - name: verify checksums
        run: |
          set -euo pipefail
          for f in *.sha256; do sha256sum -c "$f"; done
      - name: publish release (tag) or unreviewed prerelease (dispatch, schedule)
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ needs.gate.outputs.kind }}
          TAG: ${{ needs.gate.outputs.tag }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ -n "$TAG" && -n "$SHA" && -n "$REPO" && -n "$KIND" ]] || {
            echo "publish: missing TAG, SHA, REPO, or KIND" >&2
            exit 1
          }
          # Keep these names in sync with release_is_complete in the gate job.
          files=(
            cg-researcher-macos-arm64.app.zip
            cg-researcher-macos-arm64.app.zip.sha256
            cg-researcher-macos-universal.tar.gz
            cg-researcher-macos-universal.tar.gz.sha256
          )
          # Idempotent for nightly/dispatch. Do not pass --clobber: gh deletes the
          # existing asset before the replacement upload finishes.
          publish_prerelease() {
            local title="$1"
            local notes="$2"
            local draft assets f
            local -a missing
            if ! draft="$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null)"; then
              echo "creating prerelease $TAG at $SHA (not Latest)"
              gh release create "$TAG" --repo "$REPO" --target "$SHA" --prerelease --latest=false \
                --title "$title" --notes "$notes" "${files[@]}"
              return 0
            fi
            echo "release $TAG already exists; uploading only missing assets (no --clobber)"
            assets="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')"
            missing=()
            for f in "${files[@]}"; do
              if ! printf '%s\n' "$assets" | grep -Fxq -- "$f"; then
                missing+=("$f")
              fi
            done
            if [[ ${#missing[@]} -gt 0 ]]; then
              gh release upload "$TAG" --repo "$REPO" "${missing[@]}"
            else
              echo "release $TAG already has all assets; leaving them in place"
            fi
            if [[ "$draft" == "true" ]]; then
              echo "publishing draft $TAG as a prerelease (not Latest)"
              gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease --latest=false \
                --title "$title" --notes "$notes"
            fi
          }
          case "$KIND" in
            tag)
              # Published immediately. A v* push is the release; do not pass --draft.
              gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" \
                --notes "Apple Silicon app (ad-hoc signed, not notarized) + universal CLI. Verify SHA-256 before use." \
                "${files[@]}"
              ;;
            nightly)
              publish_prerelease \
                "$TAG (unreviewed nightly from main)" \
                "Automatic daily build of main @ $SHA. Unreviewed prerelease, not GitHub Latest. Apple Silicon app (ad-hoc signed, not notarized) + universal CLI. Verify SHA-256 before use."
              ;;
            dispatch)
              publish_prerelease \
                "$TAG (unreviewed manual build)" \
                "Manual workflow_dispatch of $SHA. Unreviewed prerelease, not GitHub Latest. Apple Silicon app (ad-hoc signed, not notarized) + universal CLI. Verify SHA-256 before use."
              ;;
            *)
              echo "publish ran with kind=$KIND" >&2
              exit 1
              ;;
          esac
