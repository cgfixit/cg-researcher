name: release
# On a v* tag (or manual run):
#   * app-arm64: Apple Silicon cg-researcher.app (aarch64-apple-darwin), zipped
#     with ditto + SHA-256; build provenance attested when the repo is public
#     (GitHub artifact attestations need Enterprise Cloud for private repos).
#   * universal: arm64+x86_64 CLI tarball for install-from-binary users.
#   * publish: tag runs only — a DRAFT release for human review.
# Ad-hoc signing is NOT Developer ID / notarization. Downloaded copies get
# quarantined by Gatekeeper; install.sh from source remains the supported path.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  app-arm64:
    runs-on: macos-15 # arm64 runner
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin
      - name: build (aarch64-apple-darwin)
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == arm64 ]] || { echo "expected an arm64 runner"; exit 1; }
          cargo build --release --locked -p cg-researcher --target aarch64-apple-darwin
      - name: bundle + ad-hoc sign + zip
        run: scripts/bundle-app.sh
      - name: smoke the bundle
        run: |
          set -euo pipefail
          app=dist/cg-researcher.app
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E 'Identifier=com.cgfixit.cg-researcher|flags=.*runtime'
          "$app/Contents/MacOS/cg-researcher" --version
          h="$RUNNER_TEMP/h"; "$app/Contents/MacOS/cg-researcher" --home "$h" init
          test "$(stat -f %Lp "$h")" = 700
          rm -rf "$app"; ditto -x -k dist/cg-researcher-macos-arm64.app.zip dist/
          codesign --verify --strict --deep "$app"
      - name: attest build provenance (public repos only)
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/cg-researcher-macos-arm64.app.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cg-researcher-macos-arm64-app
          path: dist/cg-researcher-macos-arm64.app.zip*
          if-no-files-found: error

  universal:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      # Intel is going away: macOS 27 (Golden Gate) is Apple silicon only and the last release
      # with Rosetta 2. Drop this job, `universal` in publish's needs, and the tarball in the
      # `gh release create` list once Intel stops mattering. This step nags from the date below.
      - name: Intel artifact sunset check
        env:
          INTEL_SUNSET: "2027-08-27"
        run: |
          if [[ ! "$(date -u +%F)" < "$INTEL_SUNSET" ]]; then
            echo "::warning title=Intel artifact sunset::universal (x86_64) tarball is past its $INTEL_SUNSET sunset date; remove this job."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: build both slices
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          set -euo pipefail
          cargo build --release --locked -p cg-researcher --target aarch64-apple-darwin
          cargo build --release --locked -p cg-researcher --target x86_64-apple-darwin
      - name: lipo, sign, package
        run: |
          set -euo pipefail
          mkdir -p dist/cg-researcher
          lipo -create -output dist/cg-researcher/cg-researcher \
            target/aarch64-apple-darwin/release/cg-researcher \
            target/x86_64-apple-darwin/release/cg-researcher
          lipo -verify_arch dist/cg-researcher/cg-researcher arm64 x86_64
          codesign --force --sign - --options runtime --identifier com.cgfixit.cg-researcher dist/cg-researcher/cg-researcher
          codesign --verify --strict dist/cg-researcher/cg-researcher
          cp -R LICENSE README.md SECURITY.md INVARIANTS.md config scripts install.command uninstall.command dist/cg-researcher/
          tar -C dist -czf "dist/cg-researcher-macos-universal.tar.gz" cg-researcher
          ( cd dist && shasum -a 256 cg-researcher-macos-universal.tar.gz > cg-researcher-macos-universal.tar.gz.sha256 )
          cat dist/*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cg-researcher-macos-universal
          path: dist/cg-researcher-macos-universal.tar.gz*
          if-no-files-found: error

  publish:
    needs: [app-arm64, universal]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cg-researcher-macos-*
          merge-multiple: true
      - name: verify checksums
        run: |
          set -euo pipefail
          for f in *.sha256; do sha256sum -c "$f"; done
      - name: draft release (review before publishing)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" --repo "$REPO" --draft --verify-tag --title "$TAG" \
            --notes "Apple Silicon app (ad-hoc signed, not notarized) + universal CLI. Verify SHA-256 before use." \
            cg-researcher-macos-arm64.app.zip cg-researcher-macos-arm64.app.zip.sha256 \
            cg-researcher-macos-universal.tar.gz cg-researcher-macos-universal.tar.gz.sha256
