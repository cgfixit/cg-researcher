name: release
# On a v* tag: build arm64 + x86_64, lipo into a universal binary, ad-hoc sign
# with the hardened runtime, and publish a tarball + SHA-256 to a draft release.
# Ad-hoc signing is NOT Developer ID / notarization. Downloaded copies get
# quarantined by Gatekeeper; the supported path stays install.sh from source.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  universal:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: build both slices
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          set -euo pipefail
          cargo build --release --locked -p cg-agent --target aarch64-apple-darwin
          cargo build --release --locked -p cg-agent --target x86_64-apple-darwin
      - name: lipo, sign, package
        run: |
          set -euo pipefail
          mkdir -p dist/cg-agent
          lipo -create -output dist/cg-agent/cg-agent \
            target/aarch64-apple-darwin/release/cg-agent \
            target/x86_64-apple-darwin/release/cg-agent
          lipo -verify_arch dist/cg-agent/cg-agent arm64 x86_64
          codesign --force --sign - --options runtime --identifier com.cgfixit.cg-agent dist/cg-agent/cg-agent
          codesign --verify --strict dist/cg-agent/cg-agent
          cp -R LICENSE README.md SECURITY.md INVARIANTS.md config scripts install.command uninstall.command dist/cg-agent/
          tar -C dist -czf "dist/cg-agent-macos-universal.tar.gz" cg-agent
          ( cd dist && shasum -a 256 cg-agent-macos-universal.tar.gz > cg-agent-macos-universal.tar.gz.sha256 )
          cat dist/*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cg-agent-macos-universal
          path: dist/cg-agent-macos-universal.tar.gz*
          if-no-files-found: error

  publish:
    needs: universal
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cg-agent-macos-universal
      - name: draft release (review before publishing)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" --repo "$REPO" --draft --verify-tag --title "$TAG" cg-agent-macos-universal.tar.gz cg-agent-macos-universal.tar.gz.sha256
