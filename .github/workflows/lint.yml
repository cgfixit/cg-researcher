name: lint
# The lint-only gate, on the product OS. Runs scripts/lint.sh (hygiene, fmt, clippy,
# shellcheck, actionlint, plutil) on an Apple Silicon runner so a contributor's
# `scripts/lint.sh` on a Mac and CI see the same thing. No tests here: ci.yml owns
# those. Runs on every push and PR, including docs-only changes, so the hygiene
# check (no data dirs, logs, keys or .enc blobs tracked) always has a result.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  lint:
    name: scripts/lint.sh (macos-15, arm64)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: actionlint 1.7.12 + shellcheck 0.11.0 (sha256-verified arm64 binaries, no brew)
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == arm64 ]] || { echo "expected an arm64 runner"; exit 1; }
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o al.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_darwin_arm64.tar.gz
          echo "aba9ced2dee8d27fecca3dc7feb1a7f9a52caefa1eb46f3271ea66b6e0e6953f  al.tgz" | shasum -a 256 -c -
          tar xzf al.tgz -C "$RUNNER_TEMP/bin" actionlint
          curl -fsSL -o sc.txz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.darwin.aarch64.tar.xz
          echo "56affdd8de5527894dca6dc3d7e0a99a873b0f004d7aabc30ae407d3f48b0a79  sc.txz" | shasum -a 256 -c -
          tar xJf sc.txz --strip-components=1 -C "$RUNNER_TEMP/bin" shellcheck-v0.11.0/shellcheck
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: scripts/lint.sh
