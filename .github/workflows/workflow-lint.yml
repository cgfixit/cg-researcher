name: workflow-lint
on:
  push:
    branches: ["cg/main"]
    paths: [".github/**", "scripts/**", "*.sh", "*.command"]
  pull_request:
  # Weekly: new actionlint/zizmor audits can flag unchanged workflows.
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint 1.7.12 (sha256-verified)
        run: |
          set -euo pipefail
          url=https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSL -o al.tgz "$url"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  al.tgz" | sha256sum -c -
          tar xzf al.tgz actionlint
          ./actionlint -color
      - name: shellcheck
        run: shellcheck scripts/*.sh install.command uninstall.command init.sh
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run zizmor==1.31.1 --offline .github/workflows
