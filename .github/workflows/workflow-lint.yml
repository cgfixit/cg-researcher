name: workflow-lint
on:
  push:
    branches: ["main"]
    paths: [".github/**", "scripts/**", "e2e/*.sh", "*.sh", "*.command"]
  pull_request:
  # Weekly: new actionlint/zizmor audits can flag unchanged workflows.
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actionlint:
    # Repo variable SCHEDULED_JOBS=false stops this job's cron runs (see README).
    if: github.event_name != 'schedule' || vars.SCHEDULED_JOBS != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint 1.7.12 (sha256-verified)
        run: |
          set -euo pipefail
          url=https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSL -o al.tgz "$url"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  al.tgz" | sha256sum -c -
          tar xzf al.tgz actionlint
          ./actionlint -color
      - name: shellcheck 0.11.0 (sha256-verified; same version lint.yml pins, not the runner's)
        run: |
          set -euo pipefail
          url=https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          curl -fsSL -o sc.txz "$url"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  sc.txz" | sha256sum -c -
          tar xJf sc.txz --strip-components=1 shellcheck-v0.11.0/shellcheck
          ./shellcheck --version | grep -q 'version: 0.11.0'
          ./shellcheck scripts/*.sh e2e/*.sh install.command uninstall.command init.sh
      - name: uninstaller path safety (stubbed platform commands)
        run: python3 scripts/test-uninstall.py
  zizmor:
    # Repo variable SCHEDULED_JOBS=false stops this job's cron runs (see README).
    if: github.event_name != 'schedule' || vars.SCHEDULED_JOBS != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run zizmor==1.31.1 --offline .github/workflows
