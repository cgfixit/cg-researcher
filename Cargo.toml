[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/cgfixit/cg-researcher"

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false }
clap = "4.6.7"
futures = "0.3.34"
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
http-body-util = "0.1.3"
prost = "0.14.4"
prost-build = "0.14.4"
protox = "0.10.0"
quick-xml = "0.42.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false }
rusqlite = "0.40.2"
scraper = { version = "0.29.0", default-features = false }
security-framework = { version = "3.7.0", default-features = false }
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
toml = "1.1.8"
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
zip = { version = "9.0.5", default-features = false }
# workspace members
cg-audit = { version = "0.1.0", path = "crates/cg-audit" }
cg-connectors = { version = "0.1.0", path = "crates/cg-connectors" }
cg-core = { version = "0.1.0", path = "crates/cg-core" }
cg-graph = { version = "0.1.0", path = "crates/cg-graph" }
cg-researcher = { version = "0.1.0", path = "crates/cg-researcher" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
